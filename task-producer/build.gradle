//            url = uri("https://maven.pkg.github.com/vindamelio/actionmnb")
//            credentials {
//                username = use
//                password = psw
//            }
//        }
//}

dependencies {
    // gradleApi() serve solo in compilazione: a runtime le classi
    // sono già fornite dal classloader di Gradle, quindi NON va
    // messa come implementation (altrimenti finisce, errata, nel POM)
    compileOnly gradleApi()
}

java {
    withSourcesJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/vindamelio/actionma")
            credentials {
                username = use
                password = psw
            }
        }
    }
}
